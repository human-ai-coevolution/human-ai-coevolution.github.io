<!doctype html>
<!-- Source template for /public/og.png. Edit the count / text here, then
     re-render to a 1200x630 PNG (see og-templates/README note). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: linear-gradient(#faf9f5, #f2f0e8);
    font-family: 'IBM Plex Sans', sans-serif;
    color: #1f1d1a;
    -webkit-font-smoothing: antialiased;
  }
  .card { position: absolute; inset: 16px; border: 1px solid #e6e3d8; border-radius: 18px; padding: 56px 64px; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .eyebrow { display: flex; align-items: center; gap: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: #6e6c64; }
  .eyebrow .rule { width: 34px; height: 2px; background: #2e6b68; display: inline-block; }
  .title { font-family: 'Fraunces', serif; font-weight: 400; font-size: 82px; line-height: 1.03; letter-spacing: -1.5px; margin-top: 40px; }
  .sub { font-size: 24px; line-height: 1.5; color: #4a473f; margin-top: 26px; max-width: 30ch; }
  .sub strong { color: #1f1d1a; font-weight: 600; }
  .foot { margin-top: auto; }
  .foot .rule { height: 1px; background: #e6e3d8; margin-bottom: 22px; }
  .foot .row { display: flex; align-items: center; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 16px; letter-spacing: 1px; text-transform: uppercase; }
  .foot .left { color: #6e6c64; }
  .foot .right { color: #2e6b68; }
  .logo { width: 66px; height: 66px; }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="eyebrow"><span class="rule"></span><span>A Research Project · 2026</span></div>
      <svg class="logo" viewBox="0 0 64 64" fill="none">
        <path d="M48 22 A20 20 0 1 0 50 36" stroke="#2e6b68" stroke-width="4.4" stroke-linecap="round"/>
        <path d="M40 8 l11 5 l-7 9 z" fill="#2e6b68"/>
        <circle cx="26" cy="33" r="4.6" fill="#2e6b68"/>
        <circle cx="41" cy="33" r="4.6" fill="#a0826d"/>
      </svg>
    </div>
    <div class="title">Human&#8211;AI<br/>Coevolution</div>
    <div class="sub"><strong>Human evolution is underdeveloped.</strong> How humans must evolve to use AI well as AI advances.</div>
    <div class="foot">
      <div class="rule"></div>
      <div class="row">
        <span class="left">Four-phase framework · 218-paper index</span>
        <span class="right">human-ai-coevolution.github.io</span>
      </div>
    </div>
  </div>
</body>
</html>
